          package anticheat;

          import cn.nukkit.Player;

          /** Публичный API для других плагинов. Использовать необязательно. */
          public final class AntiCheatAPI {
              private AntiCheatAPI() {
              }

              /** Отключить все проверки для игрока на указанное число тиков. */
              public static void exempt(Player p, int ticks) {
                  exempt(p, "all", ticks);
              }

              /** Отключить одну проверку (fly, speed, reach и т.д.) или группу (all, move) на указанное число тиков. */
              public static void exempt(Player p, String check, int ticks) {
                  AntiCheat ac = AntiCheat.get();
                  if (ac == null || p == null || check == null) {
                      return;
                  }
                  ac.window(ac.data(p), check.toLowerCase(), ticks);
              }

              /** Долгое состояние: пока флаг включён, проверка (или all, move) пропускается. */
              public static void setFlag(Player p, String flag, boolean on) {
                  AntiCheat ac = AntiCheat.get();
                  if (ac == null || p == null || flag == null) {
                      return;
                  }
                  PlayerData d = ac.data(p);
                  if (on) {
                      d.flags.add(flag.toLowerCase());
                  } else {
                      d.flags.remove(flag.toLowerCase());
                  }
              }
          }
