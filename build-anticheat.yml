name: Build AntiCheat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создание файлов проекта
        run: |
          mkdir -p src/main/java/anticheat src/main/resources
          cat > pom.xml <<'__POM_EOF__'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>anticheat</groupId>
            <artifactId>AntiCheat</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>

            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>lanink</id>
                <url>https://repo.lanink.cn/repository/maven-public/</url>
                <snapshots>
                  <enabled>true</enabled>
                </snapshots>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>cn.nukkit</groupId>
                <artifactId>Nukkit</artifactId>
                <version>MOT-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <finalName>AntiCheat</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.11.0</version>
                  <configuration>
                    <source>17</source>
                    <target>17</target>
                    <encoding>UTF-8</encoding>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          __POM_EOF__
          cat > src/main/resources/plugin.yml <<'__PLUGIN_EOF__'
          name: AntiCheat
          main: anticheat.AntiCheat
          version: 1.0.0
          api: ["1.0.0"]
          author: owner
          description: Античит по очкам подозрения - репорты админам и кики
          softdepend: [LuckPerms]
          commands:
            ac:
              description: Управление античитом
              usage: "/ac [info|reset|reload|mode]"
          permissions:
            anticheat.bypass:
              description: Иммунитет к проверкам
              default: op
            anticheat.notify:
              description: Видеть репорты античита
              default: op
            anticheat.admin:
              description: Команды /ac reload, /ac mode, /ac reset
              default: op
          __PLUGIN_EOF__
          cat > src/main/resources/config.yml <<'__CONFIG_EOF__'
          # AntiCheat для Nukkit-MOT. Все тексты и пороги настраиваются здесь.
          # Режим: soft (только репорты админам) или hard (репорты и кики).
          mode: hard

          thresholds:
            report: 5                  # порог репорта (очки)
            kick: 15                   # порог кика (очки)
            single-kick: 25            # кик сразу, если одно нарушение дошло до такой суммы очков
            min-violations-for-kick: 2 # сколько отдельных срабатываний нужно для кика по сумме очков
            kick-window-seconds: 60    # за какое время считать срабатывания
            decay-seconds: 10          # раз в сколько секунд снимается 1 очко
            report-cooldown-seconds: 30 # не чаще раза в N секунд на игрока (в консоль пишется всегда)

          ping:
            soft-above: 300     # при таком пинге пороги очков умножаются
            soft-multiplier: 1.5
            skip-above: 600     # при таком пинге проверки движения пропускаются

          tps-skip-below: 15     # при низком TPS проверки движения пропускаются
          check-interval-ticks: 2 # как часто считаются проверки (1-5), меняется только после перезапуска

          worlds: []             # пусто = все миры; иначе список названий миров

          # Окна без проверок (в тиках)
          windows:
            teleport: 60
            damage: 20
            gamemode: 40
            join: 60
            fly-off: 60

          # Команды, после которых проверки на время отключаются.
          # checks: all, move (fly, speed, nofall, timer, noslow, scaffold) или имена проверок.
          exempt-commands:
            jump:
              ticks: 100
              checks: [fly, nofall]
            speed:
              ticks: 40
              checks: [speed]
              speed-flag: true
            size:
              ticks: 40
              checks: [reach, killaura]
            god:
              ticks: 40
              checks: [nofall]
            fly:
              ticks: 60
              checks: [fly, nofall]
            timefly:
              ticks: 60
              checks: [fly, nofall]
            rtp:
              ticks: 60
              checks: [all]
            home:
              ticks: 60
              checks: [all]
            spawn:
              ticks: 60
              checks: [all]
            tp:
              ticks: 60
              checks: [all]
            mwtp:
              ticks: 60
              checks: [all]
            vtp:
              ticks: 60
              checks: [all]
            tpall:
              ticks: 60
              checks: [all]

          # Группы LuckPerms, которые видят репорты (кроме права anticheat.notify)
          notify-groups: [admin, moderator, curator]

          messages:
            report: "§e⚠ Игрока §f{player}§e возможно читер ({check})"
            kick-reason: "Подозрение на читы"
            notify-on: "§aОповещения античита включены"
            notify-off: "§cОповещения античита выключены"
            no-permission: "§cНет прав."
            usage: "§eИспользование: /ac | /ac info <ник> | /ac reset <ник> | /ac reload | /ac mode <soft|hard>"
            player-not-found: "§cИгрок не найден."
            reloaded: "§aКонфиг AntiCheat перезагружен."
            mode-set: "§aРежим AntiCheat: {mode}"
            reset-done: "§aОчки игрока {player} сброшены."
            info-head: "§eОчки игрока §f{player}§e: §f{total}"
            info-line: "§7- {check}: §f{points}"

          # Лесенка: сколько очков ВСЕГО набрано за нарушение на каждой ступени.
          # Плагин начисляет разницу со ступенью ниже. thresholds-ticks: сколько тиков нарушения нужно для ступени.
          checks:
            fly:
              enabled: true
              title: "Fly"
              ladder: [2, 5, 10, 17, 25]
              thresholds-ticks: [1, 20, 40, 60, 80]
              hover-delta: 0.05
              max-rise: 1.8
            speed:
              enabled: true
              title: "Speed"
              ladder: [2, 5, 10, 17, 25]
              thresholds-ticks: [10, 20, 40, 60, 80]
              walk: 0.22
              sprint: 0.28
              margin: 1.3
              ice-multiplier: 2.2
            reach:
              enabled: true
              title: "Reach"
              ladder: [1, 3, 6, 10, 15]
              window-seconds: 10
              base: 3.6
              ping-above: 150
              ping-bonus: 0.4
            killaura:
              enabled: true
              title: "KillAura"
              ladder: [3, 7, 12, 20]
              window-seconds: 10
              fov-degrees: 100
              same-aim-hits: 5
            autoclicker:
              enabled: true
              title: "AutoClicker"
              ladder: [2, 5, 10, 15]
              thresholds-ticks: [20, 40, 60, 80]
              max-cps: 20
              uniform-clicks: 15
              min-std-ms: 5
            nofall:
              enabled: true
              title: "NoFall"
              ladder: [2, 5, 10, 15]
              window-seconds: 60
              min-fall: 4.5
            nuker:
              enabled: true
              title: "Nuker"
              ladder: [2, 5, 10, 15]
              thresholds-ticks: [20, 40, 60, 80]
              per-second: 8
              min-break-seconds: 0.3
              min-fraction: 0.4
            scaffold:
              enabled: true
              title: "Scaffold"
              ladder: [2, 5, 10, 15]
              thresholds-ticks: [20, 40, 60, 80]
              per-second: 6
              max-pitch: 35
            timer:
              enabled: false
              title: "Timer"
              ladder: [2, 5, 10, 15]
              thresholds-ticks: [60, 80, 100, 120]
              max-packets: 25
            noslow:
              enabled: false
              title: "NoSlow"
              ladder: [2, 5, 10, 15]
              window-seconds: 10
              sneak-limit: 0.12
              use-limit: 0.12
            aimbot:
              enabled: false
              title: "Aimbot"
              ladder: [2, 5, 10, 15]
              window-seconds: 120
              min-distance: 20
              min-shots: 10
              min-ratio: 0.9
            autototem:
              enabled: false
              title: "AutoTotem"
              ladder: [2, 5, 10, 15]
              window-seconds: 120
              max-ticks: 2
          __CONFIG_EOF__
          cat > src/main/java/anticheat/AntiCheat.java <<'__ANTICHEAT_EOF__'
          package anticheat;

          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.scheduler.Task;
          import cn.nukkit.utils.ConfigSection;

          import java.io.File;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;

          /** AntiCheat для Nukkit-MOT: очки подозрения, репорты админам и кик. */
          public class AntiCheat extends PluginBase {
              private static AntiCheat instance;

              public static AntiCheat get() {
                  return instance;
              }

              static final Set<String> MOVE = new HashSet<>(Arrays.asList("fly", "speed", "nofall", "timer", "noslow", "scaffold"));

              final Map<UUID, PlayerData> players = new HashMap<>();
              final Set<UUID> muted = new HashSet<>();
              private final Map<String, Double> numCache = new HashMap<>();
              private final Map<String, Boolean> enCache = new HashMap<>();
              private final Map<String, int[]> ladCache = new HashMap<>();
              private final Map<String, int[]> thrCache = new HashMap<>();
              private final Map<String, String> titleCache = new HashMap<>();
              private final Set<String> disabled = new HashSet<>();

              boolean hard;
              String mode = "soft";
              double reportAt, kickAt, singleKick, lagMulVal;
              int minTriggers, reportCd, pingSoft, pingSkip;
              long kickWindowMs;
              float tpsSkip;
              int interval = 2;
              int winTp, winDmg, winGm, winJoin, winFlyOff;
              final Set<String> worlds = new HashSet<>();
              final List<String> notifyGroups = new ArrayList<>();
              private Checks checks;

              @Override
              public void onEnable() {
                  instance = this;
                  saveDefaultConfig();
                  loadCfg();
                  interval = Math.max(1, Math.min(5, (int) cfgNum("check-interval-ticks", 2)));
                  checks = new Checks(this);
                  getServer().getPluginManager().registerEvents(new ACListener(this), this);
                  getServer().getScheduler().scheduleRepeatingTask(this, new Task() {
                      @Override
                      public void onRun(int currentTick) {
                          checks.run(AntiCheat.this.getServer().getTick());
                      }
                  }, interval);
                  int decayTicks = Math.max(20, (int) cfgNum("thresholds.decay-seconds", 10) * 20);
                  getServer().getScheduler().scheduleRepeatingTask(this, new Task() {
                      @Override
                      public void onRun(int currentTick) {
                          decay();
                      }
                  }, decayTicks);
                  getLogger().info("AntiCheat включён, режим: " + mode);
              }

              @Override
              public void onDisable() {
                  players.clear();
                  muted.clear();
                  instance = null;
              }

              // ---------------------------------------------------------------- конфиг

              static double toNum(Object o, double def) {
                  return o instanceof Number ? ((Number) o).doubleValue() : def;
              }

              static boolean toBool(Object o, boolean def) {
                  return o instanceof Boolean ? (Boolean) o : def;
              }

              private static int[] toArr(List<Integer> l, int[] def) {
                  if (l == null || l.isEmpty()) {
                      return def;
                  }
                  int[] a = new int[l.size()];
                  for (int i = 0; i < a.length; i++) {
                      a[i] = l.get(i);
                  }
                  return a;
              }

              double cfgNum(String path, double def) {
                  return toNum(getConfig().get(path), def);
              }

              void loadCfg() {
                  numCache.clear();
                  enCache.clear();
                  ladCache.clear();
                  thrCache.clear();
                  titleCache.clear();
                  disabled.clear();
                  mode = getConfig().getString("mode", "soft").toLowerCase();
                  hard = mode.equals("hard");
                  reportAt = cfgNum("thresholds.report", 5);
                  kickAt = cfgNum("thresholds.kick", 15);
                  singleKick = cfgNum("thresholds.single-kick", 25);
                  minTriggers = (int) cfgNum("thresholds.min-violations-for-kick", 2);
                  kickWindowMs = (long) (cfgNum("thresholds.kick-window-seconds", 60) * 1000);
                  reportCd = (int) cfgNum("thresholds.report-cooldown-seconds", 30);
                  pingSoft = (int) cfgNum("ping.soft-above", 300);
                  pingSkip = (int) cfgNum("ping.skip-above", 600);
                  lagMulVal = cfgNum("ping.soft-multiplier", 1.5);
                  tpsSkip = (float) cfgNum("tps-skip-below", 15);
                  winTp = (int) cfgNum("windows.teleport", 60);
                  winDmg = (int) cfgNum("windows.damage", 20);
                  winGm = (int) cfgNum("windows.gamemode", 40);
                  winJoin = (int) cfgNum("windows.join", 60);
                  winFlyOff = (int) cfgNum("windows.fly-off", 60);
                  worlds.clear();
                  for (String w : getConfig().getStringList("worlds")) {
                      worlds.add(w.toLowerCase());
                  }
                  notifyGroups.clear();
                  notifyGroups.addAll(getConfig().getStringList("notify-groups"));
              }

              double num(String check, String key, double def) {
                  String k = check + "." + key;
                  Double v = numCache.get(k);
                  if (v == null) {
                      v = toNum(getConfig().get("checks." + check + "." + key), def);
                      numCache.put(k, v);
                  }
                  return v;
              }

              boolean enabled(String check) {
                  Boolean b = enCache.get(check);
                  if (b == null) {
                      b = toBool(getConfig().get("checks." + check + ".enabled"), true);
                      enCache.put(check, b);
                  }
                  return b && !disabled.contains(check);
              }

              int[] ladder(String check) {
                  int[] a = ladCache.get(check);
                  if (a == null) {
                      a = toArr(getConfig().getIntegerList("checks." + check + ".ladder"), new int[]{2, 5, 10, 15});
                      ladCache.put(check, a);
                  }
                  return a;
              }

              int[] thresholds(String check) {
                  int[] a = thrCache.get(check);
                  if (a == null) {
                      a = toArr(getConfig().getIntegerList("checks." + check + ".thresholds-ticks"), new int[]{20, 40, 60, 80, 100});
                      thrCache.put(check, a);
                  }
                  return a;
              }

              String title(String check) {
                  String t = titleCache.get(check);
                  if (t == null) {
                      t = getConfig().getString("checks." + check + ".title", check);
                      titleCache.put(check, t);
                  }
                  return t;
              }

              String msg(String key, String def) {
                  return getConfig().getString("messages." + key, def);
              }

              // ---------------------------------------------------------------- защита от ошибок API

              boolean isDisabled(String check) {
                  return disabled.contains(check);
              }

              /** Выполняет проверку; если API недоступно, проверка тихо отключается, в консоль идёт одна строка. */
              void guard(String check, Runnable r) {
                  if (disabled.contains(check)) {
                      return;
                  }
                  try {
                      r.run();
                  } catch (Throwable t) {
                      disabled.add(check);
                      getLogger().warning("[AntiCheat] проверка " + check + " отключена, API недоступно: " + t);
                  }
              }

              // ---------------------------------------------------------------- игроки и окна

              int tick() {
                  return getServer().getTick();
              }

              float tps() {
                  return (float) Util.num(getServer(), "getTicksPerSecond", 20);
              }

              int ping(Player p) {
                  return (int) Util.num(p, "getPing", 0);
              }

              double lagMul(Player p) {
                  return ping(p) > pingSoft ? lagMulVal : 1.0;
              }

              boolean lagSkip(Player p, float tps) {
                  return ping(p) > pingSkip || tps < tpsSkip;
              }

              boolean worldOk(Player p) {
                  if (worlds.isEmpty()) {
                      return true;
                  }
                  return p.getLevel() != null && worlds.contains(p.getLevel().getName().toLowerCase());
              }

              PlayerData data(Player p) {
                  PlayerData d = players.get(p.getUniqueId());
                  if (d == null) {
                      d = new PlayerData(p.getUniqueId(), p.getName());
                      d.joinTick = tick();
                      d.pktStart = d.joinTick;
                      players.put(p.getUniqueId(), d);
                  }
                  return d;
              }

              boolean bypass(Player p, PlayerData d, int tick) {
                  if (tick - d.bypassTick >= 100) {
                      d.bypass = p.hasPermission("anticheat.bypass");
                      d.bypassTick = tick;
                  }
                  return d.bypass;
              }

              void window(PlayerData d, String key, int ticks) {
                  int end = tick() + ticks;
                  Integer old = d.windows.get(key);
                  if (old == null || old < end) {
                      d.windows.put(key, end);
                  }
              }

              private boolean win(PlayerData d, String key, int tick) {
                  Integer t = d.windows.get(key);
                  return t != null && tick < t;
              }

              boolean exempt(PlayerData d, String check, int tick) {
                  if (d.bypass || d.flags.contains("all") || d.flags.contains(check)) {
                      return true;
                  }
                  boolean move = MOVE.contains(check);
                  if (move && d.flags.contains("move")) {
                      return true;
                  }
                  return win(d, "all", tick) || win(d, check, tick) || (move && win(d, "move", tick));
              }

              void click(PlayerData d, long now) {
                  d.clicks.addLast(now);
                  while (d.clicks.size() > 48) {
                      d.clicks.pollFirst();
                  }
              }

              /** Окно для команд из exempt-commands. */
              void commandExempt(Player p, String cmd) {
                  ConfigSection sec = getConfig().getSection("exempt-commands." + cmd);
                  if (sec == null || sec.isEmpty()) {
                      return;
                  }
                  PlayerData d = data(p);
                  int ticks = (int) toNum(sec.get("ticks"), 60);
                  List<String> list = sec.getStringList("checks");
                  if (list == null || list.isEmpty()) {
                      list = Collections.singletonList("move");
                  }
                  for (String c : list) {
                      window(d, c.toLowerCase(), ticks);
                  }
                  if (toBool(sec.get("speed-flag"), false)) {
                      d.speedCmd = true;
                  }
              }

              // ---------------------------------------------------------------- очки

              double total(PlayerData d) {
                  double s = 0;
                  for (double v : d.pts.values()) {
                      s += v;
                  }
                  return s;
              }

              /** Лесенка по длительности: cond = нарушение идёт сейчас, dt = сколько тиков прошло с прошлого замера. */
              void dur(Player p, PlayerData d, String check, boolean cond, int dt, String detail) {
                  int[] s = d.dur.get(check);
                  if (s == null) {
                      s = new int[3];
                      d.dur.put(check, s);
                  }
                  if (cond) {
                      s[0] += dt;
                      s[1] = 0;
                      int[] thr = thresholds(check);
                      while (s[2] < thr.length && s[0] >= thr[s[2]]) {
                          s[2]++;
                          flagStep(p, d, check, s[2], detail);
                      }
                  } else {
                      s[1] += dt;
                      if (s[1] >= 40) {
                          s[0] = 0;
                          s[2] = 0;
                      }
                  }
              }

              /** Лесенка по числу срабатываний в окне window-seconds. */
              void count(Player p, PlayerData d, String check, String detail) {
                  long now = System.currentTimeMillis();
                  long[] e = d.ep.get(check);
                  if (e == null) {
                      e = new long[]{now, 0};
                      d.ep.put(check, e);
                  }
                  long win = (long) (num(check, "window-seconds", 10) * 1000);
                  if (now - e[0] > win) {
                      e[0] = now;
                      e[1] = 0;
                  }
                  e[1]++;
                  flagStep(p, d, check, (int) e[1], detail);
              }

              /** Начисляет разницу очков со ступенью ниже и проверяет пороги репорта и кика. */
              void flagStep(Player p, PlayerData d, String check, int step, String detail) {
                  int[] lad = ladder(check);
                  if (step < 1 || step > lad.length) {
                      return;
                  }
                  int total = lad[step - 1];
                  int award = total - (step > 1 ? lad[step - 2] : 0);
                  if (award <= 0) {
                      return;
                  }
                  double mul = lagMul(p);
                  d.pts.merge(check, (double) award, Double::sum);
                  long now = System.currentTimeMillis();
                  d.triggers.addLast(now);
                  while (!d.triggers.isEmpty() && now - d.triggers.peekFirst() > kickWindowMs) {
                      d.triggers.pollFirst();
                  }
                  double sum = total(d);
                  if (sum >= reportAt * mul) {
                      report(p, d, check, detail, sum);
                  }
                  if (!hard) {
                      return;
                  }
                  boolean single = total >= singleKick * mul;
                  boolean multi = sum >= kickAt * mul && d.triggers.size() >= minTriggers;
                  if (single || multi) {
                      kick(p, d, title(check) + " (" + detail + "), очки " + Util.fmt(sum) + (single ? ", одно нарушение" : ""));
                  }
              }

              private void report(Player p, PlayerData d, String check, String detail, double sum) {
                  getLogger().info("[AntiCheat] " + p.getName() + ": " + title(check) + " (" + detail + "), очки " + Util.fmt(sum));
                  long now = System.currentTimeMillis();
                  if (now - d.lastReport < reportCd * 1000L) {
                      return;
                  }
                  d.lastReport = now;
                  String m = msg("report", "§e⚠ Игрока §f{player}§e возможно читер ({check})")
                          .replace("{player}", p.getName())
                          .replace("{check}", title(check));
                  for (Player a : getServer().getOnlinePlayers().values()) {
                      if (!muted.contains(a.getUniqueId()) && canNotify(a)) {
                          a.sendMessage(m);
                      }
                  }
              }

              private void kick(Player p, PlayerData d, String why) {
                  getLogger().warning("[AntiCheat] кик " + p.getName() + ": " + why);
                  d.pts.clear();
                  d.triggers.clear();
                  d.dur.clear();
                  d.ep.clear();
                  if (p.isOnline()) {
                      p.kick(msg("kick-reason", "Подозрение на читы"));
                  }
              }

              boolean canNotify(Player a) {
                  if (a.hasPermission("anticheat.notify")) {
                      return true;
                  }
                  for (String g : notifyGroups) {
                      if (inGroup(a, g)) {
                          return true;
                      }
                  }
                  return false;
              }

              /** Группа проверяется через LuckPerms API, если плагин установлен; иначе только через право group.<имя>. */
              private boolean inGroup(Player a, String g) {
                  if (a.hasPermission("group." + g)) {
                      return true;
                  }
                  try {
                      Class<?> lpc = Class.forName("net.luckperms.api.LuckPerms");
                      Object lp = Class.forName("net.luckperms.api.LuckPermsProvider").getMethod("get").invoke(null);
                      Object um = lpc.getMethod("getUserManager").invoke(lp);
                      Object user = Class.forName("net.luckperms.api.model.user.UserManager")
                              .getMethod("getUser", UUID.class).invoke(um, a.getUniqueId());
                      if (user == null) {
                          return false;
                      }
                      Object primary = Class.forName("net.luckperms.api.model.user.User").getMethod("getPrimaryGroup").invoke(user);
                      return primary != null && primary.toString().equalsIgnoreCase(g);
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Затухание: минус 1 очко раз в decay-seconds (с проверки, где очков больше всего). */
              private void decay() {
                  for (PlayerData d : players.values()) {
                      if (d.pts.isEmpty()) {
                          continue;
                      }
                      String maxKey = null;
                      double max = 0;
                      for (Map.Entry<String, Double> en : d.pts.entrySet()) {
                          if (en.getValue() > max) {
                              max = en.getValue();
                              maxKey = en.getKey();
                          }
                      }
                      if (maxKey != null) {
                          double nv = max - 1;
                          if (nv <= 0.0001) {
                              d.pts.remove(maxKey);
                          } else {
                              d.pts.put(maxKey, nv);
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- команды

              private void persistMode(String m) {
                  try {
                      getConfig().set("mode", m);
                      File f = new File(getDataFolder(), "config.yml");
                      List<String> lines = Files.readAllLines(f.toPath(), StandardCharsets.UTF_8);
                      for (int i = 0; i < lines.size(); i++) {
                          if (lines.get(i).matches("^mode:\\s*\\S+.*")) {
                              lines.set(i, "mode: " + m);
                              break;
                          }
                      }
                      Files.write(f.toPath(), lines, StandardCharsets.UTF_8);
                  } catch (Throwable t) {
                      getLogger().warning("[AntiCheat] не удалось записать режим в config.yml: " + t);
                  }
              }

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (!command.getName().equalsIgnoreCase("ac")) {
                      return false;
                  }
                  String sub = args.length > 0 ? args[0].toLowerCase() : "";
                  String noPerm = msg("no-permission", "§cНет прав.");
                  String usage = msg("usage", "§eИспользование: /ac | /ac info <ник> | /ac reset <ник> | /ac reload | /ac mode <soft|hard>");

                  if (sub.isEmpty()) {
                      if (!(sender instanceof Player)) {
                          sender.sendMessage(usage);
                          return true;
                      }
                      Player p = (Player) sender;
                      if (!canNotify(p)) {
                          sender.sendMessage(noPerm);
                          return true;
                      }
                      if (muted.remove(p.getUniqueId())) {
                          p.sendMessage(msg("notify-on", "§aОповещения античита включены"));
                      } else {
                          muted.add(p.getUniqueId());
                          p.sendMessage(msg("notify-off", "§cОповещения античита выключены"));
                      }
                      return true;
                  }

                  boolean admin = sender.hasPermission("anticheat.admin");
                  boolean notify = !(sender instanceof Player) || canNotify((Player) sender);

                  if (sub.equals("info")) {
                      if (!notify) {
                          sender.sendMessage(noPerm);
                          return true;
                      }
                      Player t = args.length > 1 ? getServer().getPlayer(args[1]) : null;
                      if (t == null) {
                          sender.sendMessage(msg("player-not-found", "§cИгрок не найден."));
                          return true;
                      }
                      PlayerData d = data(t);
                      sender.sendMessage(msg("info-head", "§eОчки игрока §f{player}§e: §f{total}")
                              .replace("{player}", t.getName()).replace("{total}", Util.fmt(total(d))));
                      for (Map.Entry<String, Double> en : d.pts.entrySet()) {
                          sender.sendMessage(msg("info-line", "§7- {check}: §f{points}")
                                  .replace("{check}", title(en.getKey())).replace("{points}", Util.fmt(en.getValue())));
                      }
                      return true;
                  }
                  if (sub.equals("reset")) {
                      if (!admin) {
                          sender.sendMessage(noPerm);
                          return true;
                      }
                      Player t = args.length > 1 ? getServer().getPlayer(args[1]) : null;
                      if (t == null) {
                          sender.sendMessage(msg("player-not-found", "§cИгрок не найден."));
                          return true;
                      }
                      PlayerData d = data(t);
                      d.pts.clear();
                      d.triggers.clear();
                      d.dur.clear();
                      d.ep.clear();
                      sender.sendMessage(msg("reset-done", "§aОчки игрока {player} сброшены.").replace("{player}", t.getName()));
                      return true;
                  }
                  if (sub.equals("reload")) {
                      if (!admin) {
                          sender.sendMessage(noPerm);
                          return true;
                      }
                      reloadConfig();
                      loadCfg();
                      sender.sendMessage(msg("reloaded", "§aКонфиг AntiCheat перезагружен."));
                      return true;
                  }
                  if (sub.equals("mode")) {
                      if (!admin) {
                          sender.sendMessage(noPerm);
                          return true;
                      }
                      if (args.length < 2 || !(args[1].equalsIgnoreCase("soft") || args[1].equalsIgnoreCase("hard"))) {
                          sender.sendMessage(usage);
                          return true;
                      }
                      mode = args[1].toLowerCase();
                      hard = mode.equals("hard");
                      persistMode(mode);
                      sender.sendMessage(msg("mode-set", "§aРежим AntiCheat: {mode}").replace("{mode}", mode));
                      return true;
                  }
                  sender.sendMessage(usage);
                  return true;
              }
          }
