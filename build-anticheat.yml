          package anticheat;

          import cn.nukkit.Player;
          import cn.nukkit.item.Item;

          import java.lang.reflect.Method;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          /** Вспомогательные методы. Всё, в чём API Nukkit-MOT может отличаться, вызывается через reflection. */
          public final class Util {
              private Util() {
              }

              private static final Map<String, Method> CACHE = new HashMap<>();

              private static Method find(Class<?> c, String name, int n) {
                  String key = c.getName() + "#" + name + "#" + n;
                  if (CACHE.containsKey(key)) {
                      return CACHE.get(key);
                  }
                  Method found = null;
                  for (Method m : c.getMethods()) {
                      if (m.getName().equals(name) && m.getParameterCount() == n) {
                          found = m;
                          break;
                      }
                  }
                  if (found != null) {
                      try {
                          found.setAccessible(true);
                      } catch (Throwable ignored) {
                          // не критично
                      }
                  }
                  CACHE.put(key, found);
                  return found;
              }

              /** Вызов метода по имени. Если метода нет или он упал, вернёт null. */
              public static Object call(Object o, String name, Object... args) {
                  if (o == null) {
                      return null;
                  }
                  try {
                      Method m = find(o.getClass(), name, args.length);
                      if (m == null) {
                          return null;
                      }
                      return m.invoke(o, args);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              public static double num(Object o, String name, double def) {
                  Object r = call(o, name);
                  return r instanceof Number ? ((Number) r).doubleValue() : def;
              }

              public static boolean bool(Object o, String name, boolean def) {
                  Object r = call(o, name);
                  return r instanceof Boolean ? (Boolean) r : def;
              }

              public static String fmt(double v) {
                  return String.format(Locale.US, "%.1f", v);
              }

              /** Разрешён ли полёт (/fly, /timefly, креатив). */
              public static boolean allowFlight(Player p) {
                  Object r = call(p, "getAllowFlight");
                  if (r instanceof Boolean) {
                      return (Boolean) r;
                  }
                  Object as = call(p, "getAdventureSettings");
                  if (as != null) {
                      try {
                          Class<?> t = Class.forName("cn.nukkit.AdventureSettings$Type");
                          Object type = t.getField("ALLOW_FLIGHT").get(null);
                          Object v = as.getClass().getMethod("get", t).invoke(as, type);
                          if (v instanceof Boolean) {
                              return (Boolean) v;
                          }
                      } catch (Throwable ignored) {
                          // API недоступно
                      }
                  }
                  return false;
              }

              public static boolean elytraWorn(Player p) {
                  try {
                      Item c = p.getInventory().getChestplate();
                      return c != null && c.getName() != null && c.getName().toLowerCase().contains("elytra");
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Планирует ли игрок на элитрах. Если метода нет, считаем по надетым элитрам. */
              public static boolean gliding(Player p) {
                  Object r = call(p, "isGliding");
                  if (r instanceof Boolean) {
                      return (Boolean) r;
                  }
                  return elytraWorn(p);
              }

              /** Едет ли игрок на существе или в транспорте. */
              public static boolean riding(Player p) {
                  if (call(p, "getRiding") != null) {
                      return true;
                  }
                  Object r = call(p, "isRiding");
                  if (r instanceof Boolean && (Boolean) r) {
                      return true;
                  }
                  try {
                      return p.getClass().getField("riding").get(p) != null;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Держит ли игрок в руке предмет с таким словом в названии (трезубец и т.п.). */
              public static boolean holds(Player p, String word) {
                  try {
                      Item h = p.getInventory().getItemInHand();
                      return h != null && h.getName() != null && h.getName().toLowerCase().contains(word);
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Время ломания блока в секундах или -1, если API недоступно. */
              public static double breakTime(Object block, Item item, Player p) {
                  if (block == null || item == null) {
                      return -1;
                  }
                  String[] names = {"calculateBreakTime", "getBreakTime"};
                  for (String name : names) {
                      for (Method m : block.getClass().getMethods()) {
                          if (!m.getName().equals(name)) {
                              continue;
                          }
                          Class<?>[] pt = m.getParameterTypes();
                          try {
                              if (pt.length == 2 && pt[0].isAssignableFrom(item.getClass()) && pt[1].isAssignableFrom(p.getClass())) {
                                  return ((Number) m.invoke(block, item, p)).doubleValue();
                              }
                          } catch (Throwable ignored) {
                              // пробуем другой вариант
                          }
                      }
                  }
                  for (String name : names) {
                      for (Method m : block.getClass().getMethods()) {
                          if (!m.getName().equals(name)) {
                              continue;
                          }
                          Class<?>[] pt = m.getParameterTypes();
                          try {
                              if (pt.length == 1 && pt[0].isAssignableFrom(item.getClass())) {
                                  return ((Number) m.invoke(block, item)).doubleValue();
                              }
                          } catch (Throwable ignored) {
                              // пробуем другой вариант
                          }
                      }
                  }
                  return -1;
              }
          }
          __UTIL_EOF__

