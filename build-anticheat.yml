          package anticheat;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.item.Item;
          import cn.nukkit.level.Level;
          import cn.nukkit.math.Vector3;
          import cn.nukkit.potion.Effect;

          import java.util.ArrayDeque;

          /** Проверки, которые считаются раз в несколько тиков (движение, клики, блоки, Timer, AutoTotem). */
          public class Checks {
              private final AntiCheat ac;

              Checks(AntiCheat ac) {
                  this.ac = ac;
              }

              /** Что вокруг игрока: жидкость, паутина, лестницы и т.д. */
              static final class Env {
                  boolean liquid, web, climb, sticky, bubble, berry, powder, ice, support;

                  boolean special() {
                      return liquid || web || climb || sticky || bubble || berry || powder;
                  }
              }

              /** Общий контекст одного замера. */
              static final class Ctx {
                  int tick, dt;
                  double x, y, z, dy;
                  Env env;
                  boolean ground, air, gm, allowFlight, glide, ride, lev, slowFall, jumpB, noFly, lag, sprint;
                  double avg, scale;
                  boolean avgOk;
              }

              private static void classify(Block b, Env e) {
                  if (b == null || b.getId() == 0) {
                      return;
                  }
                  String n = b.getName() == null ? "" : b.getName().toLowerCase();
                  if (n.contains("water") || n.contains("lava")) {
                      e.liquid = true;
                  } else if (n.contains("web")) {
                      e.web = true;
                  } else if (n.contains("ladder") || n.contains("vine") || n.contains("scaffold")) {
                      e.climb = true;
                  } else if (n.contains("slime") || n.contains("honey") || n.contains("hay")) {
                      e.sticky = true;
                  } else if (n.contains("bubble column")) {
                      e.bubble = true;
                  } else if (n.contains("berry") || n.contains("berries")) {
                      e.berry = true;
                  } else if (n.contains("powder snow")) {
                      e.powder = true;
                  }
                  if (n.contains("ice")) {
                      e.ice = true;
                  }
              }

              private Env env(Player p) {
                  Env e = new Env();
                  Level lv = p.getLevel();
                  double x = p.getX(), y = p.getY(), z = p.getZ();
                  int fx = (int) Math.floor(x), fy = (int) Math.floor(y), fz = (int) Math.floor(z);
                  classify(lv.getBlock(new Vector3(fx, fy, fz)), e);
                  classify(lv.getBlock(new Vector3(fx, fy + 1, fz)), e);
                  classify(lv.getBlock(new Vector3(fx, fy - 1, fz)), e);
                  double[] off = {0, 0.3, -0.3};
                  double[] below = {0.1, 0.6};
                  for (double ox : off) {
                      for (double oz : off) {
                          for (double by : below) {
                              Block b = lv.getBlock(new Vector3(Math.floor(x + ox), Math.floor(y - by), Math.floor(z + oz)));
                              if (b != null && b.getId() != 0 && !b.canPassThrough()) {
                                  e.support = true;
                              }
                              classify(b, e);
                          }
                      }
                  }
                  return e;
              }

              void run(int tick) {
                  float tps = ac.tps();
                  for (Player p : ac.getServer().getOnlinePlayers().values()) {
                      try {
                          one(p, tick, tps);
                      } catch (Throwable t) {
                          ac.guard("замер", () -> {
                              throw new RuntimeException(t);
                          });
                      }
                  }
              }

              private void one(Player p, int tick, float tps) {
                  if (!p.isOnline() || p.getLevel() == null) {
                      return;
                  }
                  PlayerData d = ac.data(p);
                  int dt = ac.interval;
                  if (ac.bypass(p, d, tick) || !ac.worldOk(p)) {
                      d.hasLast = false;
                      return;
                  }
                  String wn = p.getLevel().getName();
                  double x = p.getX(), y = p.getY(), z = p.getZ();

                  // первый замер, смена мира или долгий перерыв: только запоминаем позицию
                  if (!d.hasLast || !wn.equals(d.lastWorld) || tick - d.lastSampleTick > dt * 3) {
                      d.hasLast = true;
                      d.lastWorld = wn;
                      d.lx = x;
                      d.ly = y;
                      d.lz = z;
                      d.lastSampleTick = tick;
                      d.resetMove(y);
                      return;
                  }
                  double dx = x - d.lx, dy = y - d.ly, dz = z - d.lz;
                  double hdist = Math.sqrt(dx * dx + dz * dz);
                  d.lx = x;
                  d.ly = y;
                  d.lz = z;
                  d.lastSampleTick = tick;
                  if (hdist > 8 || Math.abs(dy) > 12) {
                      // неожиданный скачок позиции считаем телепортом
                      ac.window(d, "all", ac.winTp);
                      d.resetMove(y);
                      return;
                  }

                  Ctx c = new Ctx();
                  c.tick = tick;
                  c.dt = dt;
                  c.x = x;
                  c.y = y;
                  c.z = z;
                  c.dy = dy;
                  c.lag = ac.lagSkip(p, tps);
                  c.sprint = p.isSprinting();

                  double hs = hdist / dt;
                  d.lastHSpeed = hs;
                  d.speedRing[d.speedIdx] = hs;
                  d.speedIdx = (d.speedIdx + 1) % 8;
                  if (d.speedCnt < 8) {
                      d.speedCnt++;
                  }
                  d.hy[d.hIdx] = y;
                  d.ht[d.hIdx] = tick;
                  d.hIdx = (d.hIdx + 1) % 16;

                  c.env = env(p);
                  c.ground = p.isOnGround() || c.env.support;
                  c.air = !c.ground;
                  c.gm = p.isCreative() || p.isSpectator();
                  c.allowFlight = Util.allowFlight(p);
                  c.glide = Util.gliding(p);
                  c.ride = Util.riding(p);
                  c.lev = p.hasEffect(24);
                  c.slowFall = p.hasEffect(27);
                  c.jumpB = p.hasEffect(8);

                  if (d.wasAllowFlight && !c.allowFlight) {
                      ac.window(d, "fly", ac.winFlyOff);
                      ac.window(d, "nofall", ac.winFlyOff);
                  }
                  d.wasAllowFlight = c.allowFlight;

                  if (c.env.special()) {
                      d.envUntil = tick + ((c.env.sticky || c.env.bubble) ? 100 : 40);
                  }
                  if (c.env.ice) {
                      d.iceUntil = tick + 30;
                  }
                  boolean envSkip = tick < d.envUntil;
                  c.noFly = c.allowFlight || c.gm || c.glide || c.ride || c.lev || c.slowFall || c.jumpB || envSkip;

                  if (c.air) {
                      d.airTicks += dt;
                  } else {
                      d.airTicks = 0;
                  }
                  if (!c.air || c.noFly) {
                      d.lastGroundY = y;
                  }

                  // средняя горизонтальная скорость за 10 тиков и масштаб скорости (/speed)
                  int n = Math.max(1, Math.min(8, 10 / dt));
                  c.avgOk = d.speedCnt >= n;
                  if (c.avgOk) {
                      double sum = 0;
                      for (int i = 1; i <= n; i++) {
                          sum += d.speedRing[((d.speedIdx - i) % 8 + 8) % 8];
                      }
                      c.avg = sum / n;
                  }
                  double eff = 1.0;
                  Effect se = p.getEffect(1);
                  if (se != null) {
                      eff += 0.2 * (se.getAmplifier() + 1);
                  }
                  if (p.hasEffect(30)) {
                      eff *= 1.5;
                  }
                  double slow = 1.0;
                  Effect sl = p.getEffect(2);
                  if (sl != null) {
                      slow = Math.max(0.2, 1 - 0.15 * (sl.getAmplifier() + 1));
                  }
                  double ms = Util.num(p, "getMovementSpeed", -1);
                  double expected = 0.1 * (c.sprint ? 1.3 : 1.0) * eff * slow;
                  c.scale = ms > 0 ? Math.max(1.0, ms / expected) : 1.0;
                  final double effF = eff;
                  final boolean msKnown = ms > 0;

                  // падение: отслеживаем самую высокую точку
                  boolean fallTrack = c.air && !c.noFly;
                  if (fallTrack) {
                      if (!d.wasAir || y > d.peakY) {
                          d.peakY = y;
                      }
                  }

                  ac.guard("nofall", () -> noFall(p, d, c, fallTrack));
                  ac.guard("fly", () -> fly(p, d, c));
                  ac.guard("speed", () -> speed(p, d, c, effF, msKnown));
                  ac.guard("noslow", () -> noSlow(p, d, c));
                  ac.guard("scaffold", () -> scaffold(p, d, c));
                  ac.guard("nuker", () -> nuker(p, d, c));
                  ac.guard("autoclicker", () -> autoClicker(p, d, c));
                  ac.guard("timer", () -> timer(p, d, c));
                  ac.guard("autototem", () -> autoTotem(p, d, c));
                  d.wasAir = fallTrack;
              }

              private double yAgo(PlayerData d, int tick, int ago) {
                  int best = Integer.MIN_VALUE;
                  double val = Double.NaN;
                  for (int i = 0; i < 16; i++) {
                      if (d.ht[i] <= tick - ago && d.ht[i] > best && d.ht[i] > tick - 40) {
                          best = d.ht[i];
                          val = d.hy[i];
                      }
                  }
                  return val;
              }

              // ---------------------------------------------------------------- Fly

              private void fly(Player p, PlayerData d, Ctx c) {
                  boolean cond = false;
                  String detail = "";
                  if (ac.enabled("fly") && !c.lag && !c.noFly && !ac.exempt(d, "fly", c.tick) && c.air) {
                      double ago = yAgo(d, c.tick, 10);
                      boolean hover = d.airTicks >= 20 && !Double.isNaN(ago)
                              && Math.abs(c.y - ago) < ac.num("fly", "hover-delta", 0.05);
                      boolean rise = c.dy > 0.05 && (c.y - d.lastGroundY) > ac.num("fly", "max-rise", 1.8);
                      cond = hover || rise;
                      detail = hover ? "висит в воздухе " + (d.airTicks / 20) + " с" : "набор высоты без прыжка";
                  }
                  ac.dur(p, d, "fly", cond, c.dt, detail);
              }

              // ---------------------------------------------------------------- Speed

              private void speed(Player p, PlayerData d, Ctx c, double eff, boolean msKnown) {
                  boolean cond = false;
                  String detail = "";
                  boolean flyLike = c.allowFlight || c.gm || c.glide || c.ride;
                  boolean unknownCmd = !msKnown && d.speedCmd;
                  if (ac.enabled("speed") && c.avgOk && !c.lag && !flyLike && !unknownCmd
                          && !ac.exempt(d, "speed", c.tick) && !Util.holds(p, "trident")) {
                      double surf = c.tick < d.iceUntil ? ac.num("speed", "ice-multiplier", 2.2) : 1.0;
                      double base = c.sprint ? ac.num("speed", "sprint", 0.28) : ac.num("speed", "walk", 0.22);
                      double limit = base * eff * c.scale * surf * ac.num("speed", "margin", 1.3) * ac.lagMul(p);
                      if (c.avg > limit) {
                          cond = true;
                          detail = "скорость " + String.format(java.util.Locale.US, "%.2f", c.avg) + " при лимите "
                                  + String.format(java.util.Locale.US, "%.2f", limit);
                      }
                  }
                  ac.dur(p, d, "speed", cond, c.dt, detail);
              }

              // ---------------------------------------------------------------- NoSlow

              private void noSlow(Player p, PlayerData d, Ctx c) {
                  if (!ac.enabled("noslow")) {
                      return;
                  }
                  boolean sneak = p.isSneaking();
                  boolean using = Util.bool(p, "isUsingItem", false);
                  if (sneak || using) {
                      d.slowTicks += c.dt;
                  } else {
                      d.slowTicks = 0;
                      return;
                  }
                  if (d.slowTicks < 12 || !c.avgOk || !c.ground || c.env.ice || c.lag || c.allowFlight || c.gm || c.glide || c.ride
                          || ac.exempt(d, "noslow", c.tick)) {
                      return;
                  }
                  double lim = (sneak ? ac.num("noslow", "sneak-limit", 0.12) : ac.num("noslow", "use-limit", 0.12))
                          * c.scale * ac.lagMul(p);
                  if (c.avg > lim && c.tick - d.noSlowAt > 20) {
                      d.noSlowAt = c.tick;
                      ac.count(p, d, "noslow", (sneak ? "приседание" : "использование предмета") + ", скорость "
                              + String.format(java.util.Locale.US, "%.2f", c.avg));
                  }
              }

              // ---------------------------------------------------------------- NoFall

              private void noFall(Player p, PlayerData d, Ctx c, boolean fallTrack) {
                  if (!ac.enabled("nofall")) {
                      return;
                  }
                  if (d.wasAir && c.ground) {
                      double fall = d.peakY - c.y;
                      boolean soft = c.env.special();
                      if (fall > ac.num("nofall", "min-fall", 4.5) && !soft && !c.gm && !c.allowFlight && !c.glide && !c.ride
                              && !c.lev && !c.slowFall && !p.hasEffect(11) && !c.lag && !Util.bool(p, "isInvulnerable", false)
                              && !ac.exempt(d, "nofall", c.tick)) {
                          d.landTick = c.tick;
                          d.landFall = fall;
                          d.landCheckAt = c.tick + 4;
                      }
                  }
                  if (d.landCheckAt > 0 && c.tick >= d.landCheckAt) {
                      d.landCheckAt = 0;
                      if (d.lastFallEvent < d.landTick - 20 && !ac.exempt(d, "nofall", c.tick)) {
                          ac.count(p, d, "nofall", "падение " + Util.fmt(d.landFall) + " бл. без урона");
                      }
                  }
              }

              // ---------------------------------------------------------------- Scaffold, Nuker

              private static void prune(ArrayDeque<Integer> q, int minTick) {
                  while (!q.isEmpty() && q.peekFirst() < minTick) {
                      q.pollFirst();
                  }
              }

              private void scaffold(Player p, PlayerData d, Ctx c) {
                  prune(d.places, c.tick - 20);
                  boolean cond = ac.enabled("scaffold") && !c.lag && !c.gm && !ac.exempt(d, "scaffold", c.tick)
                          && d.places.size() >= (int) ac.num("scaffold", "per-second", 6);
                  ac.dur(p, d, "scaffold", cond, c.dt, "блоки под ногами: " + d.places.size() + "/с");
              }

              private void nuker(Player p, PlayerData d, Ctx c) {
                  prune(d.breaks, c.tick - 20);
                  boolean many = d.breaks.size() > (int) ac.num("nuker", "per-second", 8);
                  boolean fast = c.tick - d.fastBreakTick < 20;
                  boolean cond = ac.enabled("nuker") && !c.gm && !ac.exempt(d, "nuker", c.tick) && (many || fast);
                  ac.dur(p, d, "nuker", cond, c.dt, many ? "блоков за секунду: " + d.breaks.size() : "блок сломан слишком быстро");
              }

              // ---------------------------------------------------------------- AutoClicker

              private void autoClicker(Player p, PlayerData d, Ctx c) {
                  boolean cond = false;
                  String detail = "";
                  if (ac.enabled("autoclicker") && !ac.exempt(d, "autoclicker", c.tick) && !d.clicks.isEmpty()) {
                      long now = System.currentTimeMillis();
                      while (!d.clicks.isEmpty() && now - d.clicks.peekFirst() > 3000) {
                          d.clicks.pollFirst();
                      }
                      int cps = 0;
                      for (Long t : d.clicks) {
                          if (now - t <= 1000) {
                              cps++;
                          }
                      }
                      if (cps > (int) ac.num("autoclicker", "max-cps", 20)) {
                          cond = true;
                          detail = "кликов в секунду: " + cps;
                      } else {
                          int need = (int) ac.num("autoclicker", "uniform-clicks", 15);
                          Long[] arr = d.clicks.toArray(new Long[0]);
                          int len = arr.length;
                          if (len >= need && now - arr[len - 1] < 500) {
                              double sum = 0;
                              for (int i = len - need + 1; i < len; i++) {
                                  sum += arr[i] - arr[i - 1];
                              }
                              double mean = sum / (need - 1);
                              double var = 0;
                              for (int i = len - need + 1; i < len; i++) {
                                  double diff = (arr[i] - arr[i - 1]) - mean;
                                  var += diff * diff;
                              }
                              double std = Math.sqrt(var / (need - 1));
                              if (std < ac.num("autoclicker", "min-std-ms", 5) && mean < 300) {
                                  cond = true;
                                  detail = "одинаковые интервалы между кликами (откл. " + Util.fmt(std) + " мс)";
                              }
                          }
                      }
                  }
                  ac.dur(p, d, "autoclicker", cond, c.dt, detail);
              }

              // ---------------------------------------------------------------- Timer

              private void timer(Player p, PlayerData d, Ctx c) {
                  if (!ac.enabled("timer")) {
                      d.pkts = 0;
                      d.pktStart = c.tick;
                      return;
                  }
                  int elapsed = c.tick - d.pktStart;
                  if (elapsed < 20) {
                      return;
                  }
                  boolean skip = c.lag || ac.exempt(d, "timer", c.tick) || c.tick - d.joinTick < 200;
                  double rate = d.pkts * 20.0 / Math.max(1, elapsed);
                  boolean cond = !skip && rate > ac.num("timer", "max-packets", 25);
                  d.pkts = 0;
                  d.pktStart = c.tick;
                  ac.dur(p, d, "timer", cond, elapsed, "пакетов движения в секунду: " + (int) rate);
              }

              // ---------------------------------------------------------------- AutoTotem

              private int totemCount(Player p) {
                  Object inv = Util.call(p, "getOffhandInventory");
                  if (inv == null) {
                      return 0;
                  }
                  Object it = Util.call(inv, "getItem", 0);
                  if (it instanceof Item) {
                      Item i = (Item) it;
                      String n = i.getName();
                      if (n != null && n.toLowerCase().contains("totem")) {
                          return i.getCount();
                      }
                  }
                  return 0;
              }

              private void autoTotem(Player p, PlayerData d, Ctx c) {
                  if (!ac.enabled("autototem") || ac.exempt(d, "autototem", c.tick)) {
                      return;
                  }
                  int cur = totemCount(p);
                  if (d.prevOff > 0 && cur == 0 && c.tick - d.lastDmgTick <= 6) {
                      d.popTick = c.tick;
                  } else if (d.popTick > 0 && d.prevOff == 0 && cur > 0
                          && c.tick - d.popTick <= Math.max((int) ac.num("autototem", "max-ticks", 2), c.dt)) {
                      int took = c.tick - d.popTick;
                      d.popTick = -10000;
                      ac.count(p, d, "autototem", "тотем вернулся в руку за " + took + " т.");
                  }
                  d.prevOff = cur;
              }
          }
