          package anticheat;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.entity.Entity;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.EventPriority;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.block.BlockBreakEvent;
          import cn.nukkit.event.block.BlockPlaceEvent;
          import cn.nukkit.event.entity.EntityDamageByChildEntityEvent;
          import cn.nukkit.event.entity.EntityDamageByEntityEvent;
          import cn.nukkit.event.entity.EntityDamageEvent;
          import cn.nukkit.event.entity.EntityShootBowEvent;
          import cn.nukkit.event.player.PlayerAnimationEvent;
          import cn.nukkit.event.player.PlayerCommandPreprocessEvent;
          import cn.nukkit.event.player.PlayerGameModeChangeEvent;
          import cn.nukkit.event.player.PlayerInteractEvent;
          import cn.nukkit.event.player.PlayerJoinEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.event.player.PlayerRespawnEvent;
          import cn.nukkit.event.player.PlayerTeleportEvent;
          import cn.nukkit.event.server.DataPacketReceiveEvent;
          import cn.nukkit.math.AxisAlignedBB;

          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          /** События: окна исключений, бой (Reach, KillAura, Aimbot), блоки, клики, пакеты. */
          public class ACListener implements Listener {
              private final AntiCheat ac;
              private Object lastAttack;
              private final Map<Class<?>, Boolean> pktCache = new HashMap<>();

              ACListener(AntiCheat ac) {
                  this.ac = ac;
              }

              // ---------------------------------------------------------------- вход, выход, окна

              @EventHandler
              public void onJoin(PlayerJoinEvent e) {
                  PlayerData d = ac.data(e.getPlayer());
                  d.joinTick = ac.tick();
                  d.pktStart = d.joinTick;
                  d.hasLast = false;
                  ac.window(d, "all", ac.winJoin);
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  ac.players.remove(e.getPlayer().getUniqueId());
                  ac.muted.remove(e.getPlayer().getUniqueId());
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onRespawn(PlayerRespawnEvent e) {
                  PlayerData d = ac.data(e.getPlayer());
                  d.hasLast = false;
                  ac.window(d, "all", ac.winJoin);
              }

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onTeleport(PlayerTeleportEvent e) {
                  PlayerData d = ac.data(e.getPlayer());
                  d.hasLast = false;
                  ac.window(d, "all", ac.winTp);
              }

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onGameMode(PlayerGameModeChangeEvent e) {
                  PlayerData d = ac.data(e.getPlayer());
                  ac.window(d, "all", ac.winGm);
              }

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onCommand(PlayerCommandPreprocessEvent e) {
                  String m = e.getMessage();
                  if (m == null) {
                      return;
                  }
                  m = m.trim();
                  if (!m.startsWith("/") || m.length() < 2) {
                      return;
                  }
                  String c = m.substring(1).split("\\s+")[0].toLowerCase(Locale.ROOT);
                  int i = c.indexOf(':');
                  if (i >= 0) {
                      c = c.substring(i + 1);
                  }
                  ac.commandExempt(e.getPlayer(), c);
              }

              // ---------------------------------------------------------------- урон

              @EventHandler(priority = EventPriority.MONITOR)
              public void onDamage(EntityDamageEvent e) {
                  Entity v = e.getEntity();
                  if (v instanceof Player) {
                      Player p = (Player) v;
                      PlayerData d = ac.data(p);
                      int t = ac.tick();
                      if (e.getCause() == EntityDamageEvent.DamageCause.FALL) {
                          // фиксируем даже отменённое событие: его мог отменить другой плагин (/god)
                          d.lastFallEvent = t;
                      }
                      if (!e.isCancelled()) {
                          d.lastDmgTick = t;
                          ac.window(d, "move", ac.winDmg);
                          if (e.getCause().name().contains("EXPLOSION")) {
                              ac.window(d, "fly", 80);
                              ac.window(d, "speed", 60);
                          }
                      }
                  }
                  if (e instanceof EntityDamageByEntityEvent) {
                      attack((EntityDamageByEntityEvent) e);
                  }
              }

              // подстраховка на случай, если в этой сборке у подклассов свой список обработчиков
              @EventHandler(priority = EventPriority.MONITOR)
              public void onDamageByEntity(EntityDamageByEntityEvent e) {
                  attack(e);
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onDamageByChild(EntityDamageByChildEntityEvent e) {
                  attack(e);
              }

              private void attack(EntityDamageByEntityEvent e) {
                  if (e == lastAttack) {
                      return;
                  }
                  lastAttack = e;
                  if (e.isCancelled() || !(e.getDamager() instanceof Player)) {
                      return;
                  }
                  Player p = (Player) e.getDamager();
                  Entity victim = e.getEntity();
                  if (e instanceof EntityDamageByChildEntityEvent) {
                      ac.guard("aimbot", () -> ranged(p, victim, (EntityDamageByChildEntityEvent) e));
                      return;
                  }
                  if (e.getCause() != EntityDamageEvent.DamageCause.ENTITY_ATTACK) {
                      return;
                  }
                  PlayerData d = ac.data(p);
                  int tick = ac.tick();
                  long now = System.currentTimeMillis();
                  if (d.clicks.isEmpty() || now - d.clicks.peekLast() > 150) {
                      ac.click(d, now);
                  }
                  if (ac.bypass(p, d, tick) || !ac.worldOk(p) || ac.ping(p) > ac.pingSkip) {
                      return;
                  }
                  ac.guard("reach", () -> reach(p, d, victim, tick));
                  ac.guard("killaura", () -> killAura(p, d, victim, tick));
              }

              private void reach(Player p, PlayerData d, Entity v, int tick) {
                  if (!ac.enabled("reach") || p.isCreative() || ac.exempt(d, "reach", tick)) {
                      return;
                  }
                  double ps = Util.num(p, "getScale", 1);
                  double vs = Util.num(v, "getScale", 1);
                  if (Math.abs(ps - 1) > 0.01 || Math.abs(vs - 1) > 0.01) {
                      return;
                  }
                  AxisAlignedBB bb = v.getBoundingBox();
                  double ex = p.getX(), ey = p.getY() + p.getEyeHeight(), ez = p.getZ();
                  double cx = Math.max(bb.getMinX(), Math.min(ex, bb.getMaxX()));
                  double cy = Math.max(bb.getMinY(), Math.min(ey, bb.getMaxY()));
                  double cz = Math.max(bb.getMinZ(), Math.min(ez, bb.getMaxZ()));
                  double dist = Math.sqrt((cx - ex) * (cx - ex) + (cy - ey) * (cy - ey) + (cz - ez) * (cz - ez));
                  double lim = ac.num("reach", "base", 3.6);
                  if (ac.ping(p) > ac.num("reach", "ping-above", 150)) {
                      lim += ac.num("reach", "ping-bonus", 0.4);
                  }
                  if (dist > lim) {
                      ac.count(p, d, "reach", "дистанция " + Util.fmt(dist) + " при лимите " + Util.fmt(lim));
                  }
              }

              private void killAura(Player p, PlayerData d, Entity v, int tick) {
                  if (!ac.enabled("killaura") || ac.exempt(d, "killaura", tick)) {
                      return;
                  }
                  AxisAlignedBB bb = v.getBoundingBox();
                  double ex = p.getX(), ey = p.getY() + p.getEyeHeight(), ez = p.getZ();
                  double tx = (bb.getMinX() + bb.getMaxX()) / 2, ty = (bb.getMinY() + bb.getMaxY()) / 2,
                          tz = (bb.getMinZ() + bb.getMaxZ()) / 2;
                  boolean hit = false;
                  String why = "";

                  // 1) две разные цели в одном тике
                  long vid = v.getId();
                  if (d.atkTick == tick && d.atkTarget != vid && d.kaFlagTick != tick) {
                      hit = true;
                      why = "две цели за один тик";
                      d.kaFlagTick = tick;
                  }
                  d.atkTick = tick;
                  d.atkTarget = vid;

                  // 2) удар по цели вне поля зрения
                  double vx = tx - ex, vy = ty - ey, vz = tz - ez;
                  double len = Math.sqrt(vx * vx + vy * vy + vz * vz);
                  if (len > 1.5) {
                      double yaw = Math.toRadians(p.getYaw()), pit = Math.toRadians(p.getPitch());
                      double lx = -Math.sin(yaw) * Math.cos(pit), ly = -Math.sin(pit), lz = Math.cos(yaw) * Math.cos(pit);
                      double dot = (vx * lx + vy * ly + vz * lz) / len;
                      double ang = Math.toDegrees(Math.acos(Math.max(-1, Math.min(1, dot))));
                      if (ang > ac.num("killaura", "fov-degrees", 100)) {
                          hit = true;
                          why = "цель вне поля зрения (" + (int) ang + "°)";
                      }
                  }

                  // 3) серия ударов по движущемуся игроку без изменения yaw и pitch
                  if (v instanceof Player) {
                      boolean moved = Math.abs(tx - d.ltx) + Math.abs(ty - d.lty) + Math.abs(tz - d.ltz) > 0.1;
                      if (tick - d.lastAtkAt <= 40 && Math.abs(p.getYaw() - d.lastAtkYaw) < 0.01
                              && Math.abs(p.getPitch() - d.lastAtkPitch) < 0.01 && moved) {
                          d.sameAim++;
                      } else {
                          d.sameAim = 0;
                      }
                      if (d.sameAim >= (int) ac.num("killaura", "same-aim-hits", 5) - 1) {
                          hit = true;
                          why = "серия ударов без поворота камеры";
                          d.sameAim = 0;
                      }
                  } else {
                      d.sameAim = 0;
                  }
                  d.lastAtkYaw = (float) p.getYaw();
                  d.lastAtkPitch = (float) p.getPitch();
                  d.lastAtkAt = tick;
                  d.ltx = tx;
                  d.lty = ty;
                  d.ltz = tz;

                  if (hit) {
                      ac.count(p, d, "killaura", why);
                  }
              }

              // ---------------------------------------------------------------- снаряды (Aimbot)

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onShoot(EntityShootBowEvent e) {
                  if (!(e.getEntity() instanceof Player) || !ac.enabled("aimbot")) {
                      return;
                  }
                  PlayerData d = ac.data((Player) e.getEntity());
                  long now = System.currentTimeMillis();
                  d.shots.addLast(now);
                  while (!d.shots.isEmpty() && now - d.shots.peekFirst() > 120000) {
                      d.shots.pollFirst();
                  }
              }

              private void ranged(Player p, Entity victim, EntityDamageByChildEntityEvent e) {
                  if (!ac.enabled("aimbot")) {
                      return;
                  }
                  Entity child = e.getChild();
                  if (child == null || !child.getClass().getSimpleName().contains("Arrow")) {
                      return;
                  }
                  PlayerData d = ac.data(p);
                  int tick = ac.tick();
                  if (ac.bypass(p, d, tick) || ac.exempt(d, "aimbot", tick) || !ac.worldOk(p)) {
                      return;
                  }
                  double dist = p.distance(victim);
                  if (dist <= ac.num("aimbot", "min-distance", 20)) {
                      return;
                  }
                  long now = System.currentTimeMillis();
                  d.longHits.addLast(now);
                  while (!d.longHits.isEmpty() && now - d.longHits.peekFirst() > 120000) {
                      d.longHits.pollFirst();
                  }
                  while (!d.shots.isEmpty() && now - d.shots.peekFirst() > 120000) {
                      d.shots.pollFirst();
                  }
                  int shots = d.shots.size();
                  if (shots >= (int) ac.num("aimbot", "min-shots", 10)) {
                      double ratio = d.longHits.size() / (double) shots;
                      if (ratio > ac.num("aimbot", "min-ratio", 0.9)) {
                          ac.count(p, d, "aimbot", "попаданий " + d.longHits.size() + " из " + shots + " выстрелов, дальность "
                                  + Util.fmt(dist));
                      }
                  }
              }

              // ---------------------------------------------------------------- клики, блоки

              @EventHandler(priority = EventPriority.MONITOR)
              public void onAnimation(PlayerAnimationEvent e) {
                  ac.click(ac.data(e.getPlayer()), System.currentTimeMillis());
              }

              private static String key(Block b) {
                  return b.getFloorX() + ":" + b.getFloorY() + ":" + b.getFloorZ();
              }

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onInteract(PlayerInteractEvent e) {
                  if (e.getAction() != PlayerInteractEvent.Action.LEFT_CLICK_BLOCK || e.getBlock() == null) {
                      return;
                  }
                  PlayerData d = ac.data(e.getPlayer());
                  d.startKey = key(e.getBlock());
                  d.startTick = ac.tick();
              }

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onBreak(BlockBreakEvent e) {
                  Player p = e.getPlayer();
                  PlayerData d = ac.data(p);
                  int t = ac.tick();
                  d.breaks.addLast(t);
                  while (d.breaks.size() > 64) {
                      d.breaks.pollFirst();
                  }
                  Block b = e.getBlock();
                  if (b != null && ac.enabled("nuker") && !p.isCreative() && d.startKey.equals(key(b)) && t - d.startTick < 400) {
                      ac.guard("nuker", () -> {
                          double bt = Util.breakTime(b, e.getItem(), p);
                          double minSec = ac.num("nuker", "min-break-seconds", 0.3);
                          if (bt > minSec && (t - d.startTick) < bt * 20 * ac.num("nuker", "min-fraction", 0.4)) {
                              d.fastBreakTick = t;
                          }
                      });
                  }
                  d.startKey = "";
              }

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onPlace(BlockPlaceEvent e) {
                  Player p = e.getPlayer();
                  PlayerData d = ac.data(p);
                  Block b = e.getBlock();
                  if (b == null || d.lastHSpeed < 0.1 || p.getPitch() >= ac.num("scaffold", "max-pitch", 35)) {
                      return;
                  }
                  if (b.getFloorY() != (int) Math.floor(p.getY()) - 1) {
                      return;
                  }
                  if (Math.abs(b.getFloorX() + 0.5 - p.getX()) > 1.2 || Math.abs(b.getFloorZ() + 0.5 - p.getZ()) > 1.2) {
                      return;
                  }
                  d.places.addLast(ac.tick());
                  while (d.places.size() > 64) {
                      d.places.pollFirst();
                  }
              }

              // ---------------------------------------------------------------- пакеты (Timer)

              @EventHandler(priority = EventPriority.MONITOR)
              public void onPacket(DataPacketReceiveEvent e) {
                  Player p = e.getPlayer();
                  Object pk = e.getPacket();
                  if (p == null || pk == null) {
                      return;
                  }
                  Boolean isMove = pktCache.get(pk.getClass());
                  if (isMove == null) {
                      String n = pk.getClass().getSimpleName();
                      isMove = n.equals("MovePlayerPacket") || n.equals("PlayerAuthInputPacket");
                      pktCache.put(pk.getClass(), isMove);
                  }
                  if (!isMove) {
                      return;
                  }
                  PlayerData d = ac.players.get(p.getUniqueId());
                  if (d == null) {
                      return;
                  }
                  String n = pk.getClass().getSimpleName();
                  if (d.pktType == null) {
                      d.pktType = n;
                  }
                  if (d.pktType.equals(n)) {
                      d.pkts++;
                  }
              }
          }
